name: run-tests
on:
  workflow_run:
    workflows: ["build-project"]
    types:
      - completed

jobs:
  tests:
    # Check if the previous workflow is terminated and is a success
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    # VM avec la dernière version de ubuntu
    runs-on: ubuntu-latest
    # Image (dans ce cas alpine version 3.19)
    container:
      image: alpine:3.19

    steps:
      # Récupère le code
      - name: get-code
        uses: actions/checkout@v4

      # Installation des packages manquant
      - name: install-packages
        # --no-install-recommends limite l'utilisation de la mémoire
        # build-essential installe les packages nécessaires (gcc, make, etc...)
        # check installe le framework de tests en C
        # If debian
        # run: apt-get update && \
        #      apt-get install -y --no-install-recommends build-essential check

        # If alpine
        run: apk add --no-cache build-base check

      # Lance le make pour les tests
      - name: run-tests
        run: make test