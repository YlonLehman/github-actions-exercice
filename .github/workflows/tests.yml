# Name of the workflow
name: Run tests
# When triggered
on: [push, pull_request]

jobs:
  # Job for the tests
  tests:
    name: Perform tests
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    steps:
      # Get code
      - uses: actions/checkout@v4

      # Missing packages installation
      - name: Packages installation
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            check

      # Command line to run
      - name: Run tests
        run: make test

  # Job for the linter
  linter:
    name: Linter
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    steps:
      - uses: actions/checkout@v4
      - name: Packages installation
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            check \
            clang-tidy

      - name: Run lint
        run: make lint

  # Job for the format check
  format-check:
    name: Checks code format
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim

    steps:
      - uses: actions/checkout@v4
      - name: Packages installation
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make clang-format

      - name: Run format check
        run: make format-check